<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Server - Prices</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="assets/graphics/stingray-logo-new.jpeg">
    <script src="theme.js"></script>
    <script src="viewport-scale.js"></script>
</head>
<body>
    <div id="app"></div>
    <div class="container">
        <div id="sidebar"></div>
        <div class="main">
            <div id="topbar"></div>
            <div id="content"></div>
        </div>
    </div>
    <script src="common.js"></script>
    <script src="topbar.js"></script>
    <script src="sidebar.js"></script>
    <script src="auth-functions.js"></script>
    <script src="prices.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const isAuthenticated = await checkAuthentication();
            if (!isAuthenticated) return;

            // Access is gated on the per-user allow_price_update grant (set by a
            // super_admin), not on role. Super_admins are granted by default.
            const info = StationAuth.getUserInfo();
            if (!info || !info.allow_price_update) {
                window.location.href = 'index.html';
                return;
            }

            renderApp('Prices');
            if (typeof window.renderPrices === 'function') {
                window.renderPrices();
            } else {
                console.error('renderPrices function is not defined');
            }
        });
    </script>
</body>
</html>
