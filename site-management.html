<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Server - Site Management</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="assets/graphics/stingray-logo-new.jpeg">
    <script src="theme.js"></script>
</head>
<body>
    <div id="app"></div>
    <div class="container">
        <div id="sidebar"></div>
        <div class="main">
            <div id="topbar"></div>
            <div id="content"></div>
        </div>
    </div>
    <script src="common.js"></script>
    <script src="topbar.js"></script>
    <script src="sidebar.js"></script>
    <script src="auth-functions.js"></script>
    <script src="site-management.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const isAuthenticated = await checkAuthentication();
            if (!isAuthenticated) return;
            
            renderApp()
            if (typeof window.renderSiteManagement === 'function') {
                window.renderSiteManagement();
            } else {
                console.error('renderSiteManagement function is not defined');
            }
        });
    </script>
</body>
</html>
