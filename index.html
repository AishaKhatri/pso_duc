<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Server - Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="icon" type="image/png" href="assets/graphics/stingray-logo-new.jpeg">
    <script src="theme.js"></script>
</head>
<body>
    <div id="app"></div>
    <div class="container">
        <div id="sidebar"></div>
        <div class="main">
            <div id="topbar"></div>
            <div id="content"></div>
        </div>
    </div>
    <script src="common.js"></script>
    <script src="topbar.js"></script>
    <script src="sidebar.js"></script>
    <script src="auth-functions.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="dashboard.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const isAuthenticated = await checkAuthentication();
            if (!isAuthenticated) return;

            // Operators are scoped to their own station and don't get the network-wide dashboard
            const userInfo = StationAuth.getUserInfo();
            if (userInfo?.role === 'operator') {
                window.location.href = 'dispensers.html';
                return;
            }

            renderApp();
            if (typeof window.renderDashboard === 'function') {
                window.renderDashboard();
            } else {
                console.error('renderDashboard function is not defined');
            }
        });
    </script>
</body>
</html>
