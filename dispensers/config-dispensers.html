<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Server - Dispensers</title>
    <link rel="stylesheet" href="../styles.css">
    <!-- Set base href to the parent directory to resolve image paths correctly -->
    <base href="../" />
    <link rel="icon" type="image/png" href="assets/graphics/stingray-logo-new.jpeg">
    <script src="theme.js"></script>
</head>
<body>
    <div id="app"></div>
    <div class="container">
        <div id="sidebar"></div>
        <div class="main">
            <div id="topbar"></div>
            <div id="content"></div>
        </div>
    </div>
    <script src="common.js"></script>
    <script src="topbar.js"></script>
    <script src="sidebar.js"></script>
    <script src="auth-functions.js"></script>
    <script src="dispensers/config-dispensers.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const isAuthenticated = await checkAuthentication();
            if (!isAuthenticated) return;

            // Configuring dispensers is restricted to admin and operator
            const userInfo = StationAuth.getUserInfo();
            if (userInfo?.role !== 'admin' && userInfo?.role !== 'super_admin' && userInfo?.role !== 'operator') {
                window.location.href = '../dispensers.html';
                return;
            }

            renderApp('Configure Dispensers')
            if (typeof window.renderConfigDispensers === 'function') {
                window.renderConfigDispensers();
            } else {
                console.error('renderConfigDispensers function is not defined');
            }
        });
    </script>
</body>
</html>
